<!DOCTYPE html>
<html>
<head>
    <title>Login - Pham Long RPC</title>
    <style>
        body { background: #0a0a12; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1a1a2e; padding: 40px; border-radius: 20px; width: 360px; text-align: center; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #2a2a3e; color: white; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #5865f2; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #4752c4; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #error { color: #ed4245; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎮 Pham Long RPC</h1>
        <p>Đăng nhập bằng token Discord</p>
        <input id="token" placeholder="Nhập token Discord..." type="password">
        <button onclick="login()">🔑 Đăng nhập</button>
        <p id="error"></p>
    </div>
    <script>
        async function login() {
            const token = document.getElementById('token').value.trim();
            const errorEl = document.getElementById('error');
            const btn = document.querySelector('button');
            
            if (!token) {
                errorEl.textContent = 'Vui lòng nhập token!';
                return;
            }
            
            errorEl.textContent = '';
            btn.textContent = '⏳ Đang đăng nhập...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = '❌ ' + data.error;
                    btn.textContent = '🔑 Đăng nhập';
                    btn.disabled = false;
                }
            } catch (e) {
                errorEl.textContent = '❌ Lỗi kết nối: ' + e.message;
                btn.textContent = '🔑 Đăng nhập';
                btn.disabled = false;
            }
        }
        
        // Cho phép Enter để đăng nhập
        document.getElementById('token').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
