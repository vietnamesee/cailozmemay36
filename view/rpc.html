<!DOCTYPE html>
<html>
<head>
    <title>RPC Manager - Pham Long RPC</title>
    <style>
        body { background: #0a0a12; color: white; font-family: Arial; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1a1a2e; padding: 20px; border-radius: 16px; margin: 10px 0; }
        input, select { width: 100%; padding: 10px; border-radius: 10px; border: none; background: #2a2a3e; color: white; margin: 5px 0; }
        button { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #5865f2; color: white; }
        .btn-success { background: #57f287; color: black; }
        .btn-danger { background: #ed4245; color: white; }
        a { color: #7289da; text-decoration: none; }
        .rpc-item { background: #2a2a3e; padding: 15px; border-radius: 12px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .running { background: #57f287; }
        .stopped { background: #6a6a82; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label { font-size: 13px; color: #8a8aa0; display: block; margin-top: 8px; margin-bottom: 4px; }
        .btn-danger-sm { background: #ed4245; color: white; padding: 6px 12px; font-size: 13px; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 RPC Manager</h1>
        <a href="/dashboard">← Dashboard</a>

        <div class="card">
            <h2>➕ Tạo RPC mới</h2>
            
            <label>🔑 Token Discord *</label>
            <input id="rpcToken" placeholder="Nhập token..." type="password">
            
            <label>📝 Tên game *</label>
            <input id="rpcName" placeholder="VD: Visual Studio Code...">
            
            <label>🎮 Loại</label>
            <select id="rpcType">
                <option value="PLAYING">🎮 Playing</option>
                <option value="STREAMING">📺 Streaming</option>
                <option value="LISTENING">🎧 Listening</option>
                <option value="WATCHING">👁️ Watching</option>
            </select>
            
            <div class="row2">
                <div>
                    <label>Details</label>
                    <input id="rpcDetails" placeholder="Dòng 1...">
                </div>
                <div>
                    <label>State</label>
                    <input id="rpcState" placeholder="Dòng 2...">
                </div>
            </div>
            
            <div class="row2">
                <div>
                    <label>🖼️ Ảnh lớn (URL hoặc Asset Key)</label>
                    <input id="rpcLargeImage" placeholder="https://... hoặc tên ảnh">
                </div>
                <div>
                    <label>Text ảnh lớn</label>
                    <input id="rpcLargeText" placeholder="Tooltip...">
                </div>
            </div>
            
            <div class="row2">
                <div>
                    <label>🖼️ Ảnh nhỏ</label>
                    <input id="rpcSmallImage" placeholder="https://... hoặc tên ảnh">
                </div>
                <div>
                    <label>Text ảnh nhỏ</label>
                    <input id="rpcSmallText" placeholder="Tooltip...">
                </div>
            </div>
            
            <!-- BUTTON 1 -->
            <div class="row2">
                <div>
                    <label>🔗 Button 1 Label</label>
                    <input id="rpcBtn1Label" placeholder="Website...">
                </div>
                <div>
                    <label>URL 1</label>
                    <input id="rpcBtn1Url" placeholder="https://...">
                </div>
            </div>
            
            <!-- BUTTON 2 -->
            <div class="row2">
                <div>
                    <label>🔗 Button 2 Label</label>
                    <input id="rpcBtn2Label" placeholder="Discord...">
                </div>
                <div>
                    <label>URL 2</label>
                    <input id="rpcBtn2Url" placeholder="https://...">
                </div>
            </div>
            
            <button class="btn-primary" onclick="createRpc()" style="margin-top:12px; width:100%;">▶️ Bật RPC</button>
        </div>

        <div class="card">
            <h2>📌 Danh sách RPC</h2>
            <div id="rpcList">Đang tải...</div>
        </div>
    </div>

    <script>
        async function createRpc() {
            const token = document.getElementById('rpcToken').value.trim();
            const name = document.getElementById('rpcName').value.trim();
            const type = document.getElementById('rpcType').value;
            const details = document.getElementById('rpcDetails').value.trim();
            const state = document.getElementById('rpcState').value.trim();
            const largeImage = document.getElementById('rpcLargeImage').value.trim();
            const largeText = document.getElementById('rpcLargeText').value.trim();
            const smallImage = document.getElementById('rpcSmallImage').value.trim();
            const smallText = document.getElementById('rpcSmallText').value.trim();
            const btn1Label = document.getElementById('rpcBtn1Label').value.trim();
            const btn1Url = document.getElementById('rpcBtn1Url').value.trim();
            const btn2Label = document.getElementById('rpcBtn2Label').value.trim();
            const btn2Url = document.getElementById('rpcBtn2Url').value.trim();

            if (!token) return alert('❌ Vui lòng nhập token!');
            if (!name) return alert('❌ Vui lòng nhập tên game!');

            const config = {
                name,
                type,
                details,
                state,
                largeImage,
                largeText,
                smallImage,
                smallText,
                status: 'online',
                startTimestamp: Date.now(),
                buttons: []
            };

            if (btn1Label && btn1Url) config.buttons.push({ label: btn1Label, url: btn1Url });
            if (btn2Label && btn2Url) config.buttons.push({ label: btn2Label, url: btn2Url });

            try {
                const res = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, config })
                });
                const data = await res.json();
                if (data.success) {
                    alert('✅ RPC đã khởi động!');
                    loadRPCs();
                } else {
                    alert('❌ Lỗi: ' + data.error);
                }
            } catch (error) {
                alert('❌ Lỗi kết nối: ' + error.message);
            }
        }

        async function loadRPCs() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const list = document.getElementById('rpcList');
                if (data.rpcs.length === 0) {
                    list.innerHTML = '<p>📭 Chưa có RPC nào</p>';
                    return;
                }
                list.innerHTML = data.rpcs.map(r => `
                    <div class="rpc-item">
                        <div>
                            <span class="status-dot ${r.status === 'running' ? 'running' : 'stopped'}"></span>
                            <strong>${r.name}</strong>
                            <span style="color: #8a8aa0; font-size: 13px;">${r.token}</span>
                        </div>
                        <span style="color: ${r.status === 'running' ? '#57f287' : '#6a6a82'}; font-size: 13px;">
                            ${r.status === 'running' ? '🟢 Đang chạy' : '⚫ Đã dừng'}
                        </span>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('rpcList').textContent = '❌ Lỗi tải danh sách';
            }
        }

        loadRPCs();
        setInterval(loadRPCs, 5000);
    </script>
</body>
</html>
